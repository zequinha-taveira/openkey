[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openkey-manager"
version = "0.1.0"
description = "OpenKey Manager - aplicação desktop do OpenKey (Fase 10)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0 OR MIT" }
dependencies = [
    "openkey-sdk>=0.6.0",
    "PySide6>=6.6",
    "openkey-diagnostics>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
openkey-manager = "openkey_manager.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openkey_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

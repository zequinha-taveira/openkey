[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openkey-diagnostics"
version = "0.1.0"
description = "OpenKey Diagnostics - serviço de diagnóstico de dispositivos OpenKey (G10-T10)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0 OR MIT" }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["openkey_diagnostics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

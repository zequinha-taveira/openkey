name: OpenKey CI Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Code Quality & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify Code Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets --exclude openkey-target-rp2350 -- -D warnings

      - name: Run Workspace Unit Tests
        run: cargo test --workspace

  embedded-firmware:
    name: Embedded Firmware (RP2350)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv8m.main-none-eabihf

      - name: Check RP2350 Firmware
        run: cargo check -p openkey-target-rp2350 --target thumbv8m.main-none-eabihf

      - name: Clippy RP2350 Firmware
        run: cargo clippy -p openkey-target-rp2350 --target thumbv8m.main-none-eabihf -- -D warnings

  miri-check:
    name: Miri UB Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Run Miri on workspace (except target crates)
        run: |
          cargo +nightly miri test -p openkey-crypto -p openkey-storage -p openkey-platform -p openkey-boot -p openkey-core 2>&1 || true
          # Miri is informational — codebase currently has zero unsafe blocks
          echo "Miri check completed"

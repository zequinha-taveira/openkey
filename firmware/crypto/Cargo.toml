[package]
name = "openkey-crypto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Abstrações criptográficas do OpenKey (no_std)"

[dependencies]
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes"] }
p256 = { version = "0.13.0", default-features = false, features = ["ecdsa", "pkcs8", "arithmetic"] }
ecdsa = { version = "0.16.0", default-features = false }
ed25519-dalek = { version = "2.0.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.10.0", default-features = false }
zeroize = { version = "1.8.2", default-features = false }
heapless = { version = "0.8.0", default-features = false }

[features]
default = []
std = ["p256/std", "ecdsa/std", "ed25519-dalek/std", "sha2/std"]

[dev-dependencies]
rand = "0.8"

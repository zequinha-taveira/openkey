[workspace]
resolver = "2"
members = [
    "crates/openkey-core",
    "crates/openkey-crypto",
    "crates/openkey-vault",
    "crates/openkey-protocol-fido",
    "crates/openkey-protocol-apdu",
    "crates/openkey-usb",
    "crates/openkey-update",
    "tools/openkey-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/zequinha-taveira/openkey"

[workspace.dependencies]
openkey-core = { path = "crates/openkey-core" }
openkey-crypto = { path = "crates/openkey-crypto" }
openkey-vault = { path = "crates/openkey-vault" }
openkey-protocol-fido = { path = "crates/openkey-protocol-fido" }
openkey-protocol-apdu = { path = "crates/openkey-protocol-apdu" }
openkey-usb = { path = "crates/openkey-usb" }
openkey-update = { path = "crates/openkey-update" }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

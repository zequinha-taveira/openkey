[workspace]
resolver = "2"
members = [
    "protocol/core",
    "protocol/protocols",
    "firmware/platform",
    "firmware/storage",
    "firmware/crypto",
    "firmware/usb",
    "firmware/config",
    "firmware/boot",
    "firmware/platform/mcu/rp23xx",
    "simulator",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["OpenKey Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/openkey/openkey"

[workspace.dependencies]
openkey-core = { path = "protocol/core" }
openkey-platform = { path = "firmware/platform" }
openkey-protocols = { path = "protocol/protocols" }
openkey-storage = { path = "firmware/storage" }
openkey-crypto = { path = "firmware/crypto" }
openkey-usb = { path = "firmware/usb" }
openkey-config = { path = "firmware/config" }
openkey-boot = { path = "firmware/boot" }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

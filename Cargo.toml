[workspace]
resolver = "2"
members = [
    "crates/openkey-core",
    "crates/openkey-crypto",
    "crates/openkey-vault",
    "crates/openkey-protocol-fido",
    "crates/openkey-protocol-apdu",
    "crates/openkey-usb",
    "crates/openkey-update",
    "crates/openkey-host",
    "simulator",
    "tools/openkey-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/zequinha-taveira/openkey"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"

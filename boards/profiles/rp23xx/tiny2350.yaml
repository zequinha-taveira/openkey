board:
  manufacturer: "Unexpected Maker"
  model: "Tiny 2350"
  revision: "1.0"
  mcu: "rp23xx"

flash:
  total_size_kb: 8192
  page_size_bytes: 4096
  sector_size_bytes: 4096

usb:
  vid: 0x303A
  pid: 0x8232
  bcd_version: "2.00"
  max_packet_size: 64
  product_string: "OpenKey Tiny 2350"
  manufacturer_string: "OpenKey / Unexpected Maker"

# Nota VID/PID: VID/PID do fabricante (Unexpected Maker) — correto para placas de dev.
# Em hardware customizado com firmware OpenKey, usar o par pid.codes
# 0x1209:0x4F4B (ver docs/reference/usb-vid-pid.md).

gpio:
  led:
    pin: 18
    port: 0
    active_high: true
  button:
    pin: 23
    port: 0
    active_low: true
    pull_up: true

features:
  has_nfc: false
  has_ble: false
  has_secure_element: false
  has_tamper_detect: false
